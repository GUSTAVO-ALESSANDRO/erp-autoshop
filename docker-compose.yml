version: '3.8'

services:
  # Serviço do Banco de Dados Relacional
  postgres:
    image: postgres:16-alpine
    container_name: autocar_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-autocar_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Executa automaticamente o script SQL de migrations no primeiro startup:
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - autocare-net

  # Serviço da Aplicação Node.js
  app:
    build: .
    container_name: autocare_app
    restart: always
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-autocar_db}
    depends_on:
      - postgres
    networks:
      - autocare-net

volumes:
  postgres_data:

networks:
  autocare-net:
    driver: bridge