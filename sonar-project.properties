sonar.projectKey=GUSTAVO-ALESSANDRO_erp-autoshop
sonar.organization=gustavo-alessandro

# Caminho do código-fonte e exclusões gerais
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/coverage/**,**/tests/**,database/migrations/**

# Excluir os contratos/interfaces de domain da contagem de cobertura
sonar.coverage.exclusions=**/node_modules/**,**/coverage/**,**/tests/**,database/migrations/**,src/domain/contracts/**

# Configuração dos testes e do relatório lcov gerado pelo Jest
sonar.tests=tests
sonar.javascript.lcov.reportPaths=coverage/lcov.info